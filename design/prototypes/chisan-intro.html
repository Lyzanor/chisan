<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chisan — Animación Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@350;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss: #00563F;
      --moss-dark: #003D2D;
      --rice-paper: #FFFFFF;
      --stone: #59645D;
      --chisan-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--rice-paper);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Outfit", -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      cursor: pointer;
    }

    /* Aviso de audio */
    .audio-notice {
      position: absolute;
      top: 28px;
      font-size: 13px;
      font-weight: 500;
      color: var(--stone);
      background: rgba(246, 247, 246, 0.9);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #D8DFDA;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.4s;
      z-index: 100;
    }

    .viewport {
      position: relative;
      width: 100%;
      max-width: 860px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .wordmark-stage {
      position: relative;
      width: 580px;
      height: 132px;
    }

    .wordmark-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 1. Cuerpo de la C con reacción física de impacto */
    .c-body {
      transform-origin: 177px 167px;
      pointer-events: none;
      animation: cBodyImpactReaction 5.2s var(--chisan-ease) infinite;
    }

    /* 2. El personaje / módulo saltarín */
    .mascot-group {
      transform-origin: 306px 43px;
      animation: mascotMovement 5.2s var(--chisan-ease) infinite;
    }

    /* Ojos minimalistas con estiramiento */
    .mascot-eyes {
      transform-origin: 306px 43px;
      animation: eyesMinimalistStretch 5.2s ease infinite;
    }

    /* Sombra del personaje en el suelo */
    .mascot-shadow {
      transform-origin: 306px 212px;
      animation: shadowAnim 5.2s ease infinite;
    }

    /* 3. Despliegue elástico de "hisan" */
    .hisan-group {
      animation: revealHisanSpring 5.2s var(--chisan-ease) infinite;
    }

    /* Tagline oficial */
    .tagline {
      margin-top: 28px;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--stone);
      animation: taglineFade 5.2s var(--chisan-ease) infinite;
    }

    /* --- REACCIÓN FÍSICA EN LA C AL RECIBIR EL IMPACTO --- */
    @keyframes cBodyImpactReaction {
      0%, 50% {
        transform: translate(0, 0) scale(1, 1);
      }
      51% {
        transform: translate(0.8px, 2.8px) scale(1.012, 0.982);
      }
      53.5% {
        transform: translate(-0.4px, -1.2px) scale(0.994, 1.008);
      }
      56% {
        transform: translate(0.2px, 0.4px) scale(1.002, 0.998);
      }
      58%, 88% {
        transform: translate(0, 0) scale(1, 1);
        opacity: 1;
      }
      95%, 100% {
        transform: translate(0, 0) scale(1, 1);
        opacity: 0;
      }
    }

    /* --- MOVIMIENTO DEL CUADRADITO --- */
    @keyframes mascotMovement {
      0% {
        transform: translate(-380px, 170px) scale(1, 1) rotate(0deg);
      }
      7% {
        transform: translate(-380px, 170px) scale(0.98, 1.02) rotate(-8deg);
      }
      12% {
        transform: translate(-380px, 170px) scale(1, 1) rotate(0deg);
      }
      /* Descubre la C: Momento Ajá */
      16% {
        transform: translate(-380px, 166px) scale(1.04, 0.98) rotate(6deg);
      }
      /* Saltito de alegría */
      19% {
        transform: translate(-380px, 174px) scale(1.15, 0.85) rotate(0deg);
      }
      23% {
        transform: translate(-380px, 138px) scale(0.9, 1.2) rotate(-2deg);
      }
      26% {
        transform: translate(-380px, 172px) scale(1.1, 0.9) rotate(0deg);
      }
      29% {
        transform: translate(-380px, 170px) scale(1, 1) rotate(0deg);
      }
      /* Meneo preparatorio */
      31% {
        transform: translate(-380px, 172px) scale(1.08, 0.92) rotate(-4deg);
      }
      33% {
        transform: translate(-380px, 172px) scale(1.08, 0.92) rotate(4deg);
      }
      /* Gran compresión */
      36% {
        transform: translate(-380px, 185px) scale(1.28, 0.72) rotate(0deg);
      }
      /* Vuelo en parábola */
      39% {
        transform: translate(-360px, 130px) scale(0.82, 1.28) rotate(-10deg);
      }
      45% {
        transform: translate(-140px, -115px) scale(1.04, 0.96) rotate(-16deg);
      }
      /* Fase 1: Micro-contacto previo (ti-) */
      49% {
        transform: translate(3px, -5px) scale(0.97, 1.03) rotate(3deg);
      }
      /* Fase 2: ¡BLOQUEO MECÁNICO CLACK! */
      51% {
        transform: translate(0px, 0px) scale(1.18, 0.84) rotate(0deg);
      }
      54% {
        transform: translate(0px, 0px) scale(0.96, 1.05) rotate(0deg);
      }
      57% {
        transform: translate(0px, 0px) scale(1.02, 0.99) rotate(0deg);
      }
      60%, 88% {
        transform: translate(0px, 0px) scale(1, 1) rotate(0deg);
        opacity: 1;
      }
      95%, 100% {
        transform: translate(0px, 0px) scale(1, 1);
        opacity: 0;
      }
    }

    /* --- OJOS MINIMALISTAS --- */
    @keyframes eyesMinimalistStretch {
      0%, 4% { transform: translate(0, 0) scale(1, 1); opacity: 1; }
      5% { transform: translate(0, 0) scale(1, 0.1); }
      6% { transform: translate(0, 0) scale(1, 1); }
      7%, 12% { transform: translate(-5px, 0) scale(1, 1); }
      14% { transform: translate(0, 0) scale(1, 1); }
      /* Momento Ajá: estiramiento vertical de sorpresa */
      16%, 18% { transform: translate(5px, -3px) scale(1.05, 1.48); }
      /* Saltito de entusiasmo */
      19% { transform: translate(2px, 1px) scale(1.18, 0.82); }
      23% { transform: translate(4px, -4px) scale(1.08, 1.38); }
      26% { transform: translate(2px, 0px) scale(1.02, 1.02); }
      29% { transform: translate(0, 0) scale(1, 1); }
      33%, 36% { transform: translate(4px, -2px) scale(1.15, 0.85); }
      39%, 49% { transform: translate(4px, -2px) scale(1.05, 1.15); }
      /* Guiño de satisfacción al encajar */
      51% { transform: translate(0, 0) scale(1.2, 0.12); }
      53% { transform: translate(0, 0) scale(1, 1); opacity: 0.9; }
      56%, 100% { opacity: 0; }
    }

    /* Sombra en el suelo */
    @keyframes shadowAnim {
      0%, 6% { opacity: 0.25; transform: translate(-380px, 0) scale(1, 1); }
      7%, 18% { opacity: 0.25; transform: translate(-380px, 0) scale(1, 1); }
      19% { opacity: 0.35; transform: translate(-380px, 0) scale(1.2, 1.1); }
      23% { opacity: 0.12; transform: translate(-380px, 0) scale(0.7, 0.7); }
      26% { opacity: 0.3; transform: translate(-380px, 0) scale(1.1, 1); }
      36% { opacity: 0.4; transform: translate(-380px, 0) scale(1.35, 1.2); }
      42% { opacity: 0.1; transform: translate(-260px, 0) scale(0.5, 0.5); }
      48%, 100% { opacity: 0; }
    }

    /* Despliegue elástico de "hisan" */
    @keyframes revealHisanSpring {
      0%, 52% { clip-path: inset(0 100% 0 0); opacity: 0; transform: translateX(-24px); }
      53% { clip-path: inset(0 100% 0 0); opacity: 0.4; transform: translateX(-24px); }
      65% { clip-path: inset(0 0% 0 0); opacity: 1; transform: translateX(2.5px); }
      69% { clip-path: inset(0 0% 0 0); opacity: 1; transform: translateX(-0.8px); }
      73%, 88% { clip-path: inset(0 0% 0 0); opacity: 1; transform: translateX(0px); }
      95%, 100% { opacity: 0; }
    }

    /* Tagline */
    @keyframes taglineFade {
      0%, 64% { opacity: 0; transform: translateY(10px); }
      76%, 88% { opacity: 1; transform: translateY(0); }
      95%, 100% { opacity: 0; }
    }
  </style>
</head>

  <script>
    // MOTOR DE AUDIO (Web Audio API)
    let audioCtx = null;
    let isAudioActive = false;
    let cycleTimer = null;

    const CYCLE_DURATION = 5.2; // Segundos del ciclo

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      isAudioActive = true;
      const notice = document.getElementById("audioNotice");
      if (notice) {
        notice.innerHTML = "<span>🔊 Sonido activo — Haz clic para reiniciar</span>";
        notice.style.opacity = "0.7";
      }
    }

    // 1. Despertar / curiosidad (t = 0.85s): Micro-blip cálido
    function playCuriosityTone(startTime) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(360, startTime);
      osc.frequency.exponentialRampToValueAtTime(520, startTime + 0.12);
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(0.04, startTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.14);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.15);
    }

    // 2. Saltito en el suelo (t = 1.20s): Tap de madera
    function playWoodHop(startTime) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(260, startTime);
      osc.frequency.exponentialRampToValueAtTime(140, startTime + 0.08);
      gain.gain.setValueAtTime(0.09, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.09);
    }

    // 3. Vuelo en el aire (t = 2.05s): Suspiro de aire acústico
    function playAirWhoosh(startTime) {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.4;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.5;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.value = 2.2;
      filter.frequency.setValueAtTime(450, startTime);
      filter.frequency.exponentialRampToValueAtTime(1100, startTime + 0.2);
      filter.frequency.exponentialRampToValueAtTime(500, startTime + 0.38);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(0.045, startTime + 0.18);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.38);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(startTime);
      noise.stop(startTime + 0.4);
    }

    // --- EL IMPACTO EN LA C ---

    // Fase 1 (t = 2.50s): Micro-contacto previo de guía (ti-)
    function playPreContact(startTime) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1400, startTime);
      osc.frequency.exponentialRampToValueAtTime(700, startTime + 0.018);
      gain.gain.setValueAtTime(0.09, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.018);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.02);
    }

    // Fase 2 (t = 2.65s): Bloqueo mecánico definitivo (-CLACK!)
    function playSnapImpact(startTime) {
      if (!audioCtx) return;

      const oscClick = audioCtx.createOscillator();
      const gainClick = audioCtx.createGain();
      oscClick.type = "triangle";
      oscClick.frequency.setValueAtTime(1900, startTime);
      oscClick.frequency.exponentialRampToValueAtTime(850, startTime + 0.03);
      gainClick.gain.setValueAtTime(0.30, startTime);
      gainClick.gain.exponentialRampToValueAtTime(0.001, startTime + 0.03);
      oscClick.connect(gainClick);
      gainClick.connect(audioCtx.destination);
      oscClick.start(startTime);
      oscClick.stop(startTime + 0.035);

      const oscBody = audioCtx.createOscillator();
      const gainBody = audioCtx.createGain();
      oscBody.type = "sine";
      oscBody.frequency.setValueAtTime(560, startTime);
      oscBody.frequency.exponentialRampToValueAtTime(340, startTime + 0.1);
      gainBody.gain.setValueAtTime(0.26, startTime);
      gainBody.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.1);
      oscBody.connect(gainBody);
      gainBody.connect(audioCtx.destination);
      oscBody.start(startTime);
      oscBody.stop(startTime + 0.11);

      const oscThud = audioCtx.createOscillator();
      const gainThud = audioCtx.createGain();
      oscThud.type = "sine";
      oscThud.frequency.setValueAtTime(190, startTime);
      oscThud.frequency.exponentialRampToValueAtTime(65, startTime + 0.09);
      gainThud.gain.setValueAtTime(0.28, startTime);
      gainThud.gain.exponentialRampToValueAtTime(0.001, startTime + 0.09);
      oscThud.connect(gainThud);
      gainThud.connect(audioCtx.destination);
      oscThud.start(startTime);
      oscThud.stop(startTime + 0.1);
    }

    // --- EL FINAL INSPIRADOR: MOTIVO ACÚSTICO ASCENDENTE DE DESCUBRIMIENTO ---
    // En lugar de un acorde plano, una frase ascendente de 3 notas de madera/cuerda limpia
    // que abre el espacio e invita a explorar (Sol4 -> Do5 -> Mi5)
    function playDiscoveryPhrase(startTime) {
      if (!audioCtx) return;

      // 3 notas en cadencia ascendente: Sol4 (392Hz), Do5 (523Hz), Mi5 (659Hz)
      const notes = [
        { freq: 392.00, delay: 0.05, dur: 0.9, gain: 0.045 }, // Sol (cálido, raíz)
        { freq: 523.25, delay: 0.22, dur: 1.1, gain: 0.055 }, // Do (luminoso, despega)
        { freq: 659.25, delay: 0.40, dur: 1.4, gain: 0.065 }  // Mi (abierto, queda flotando en el aire)
      ];

      notes.forEach(n => {
        const noteTime = startTime + n.delay;

        // Oscilador con timbre orgánico de marimba / kalimba (mezcla de seno y triángulo)
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(n.freq, noteTime);

        // Armónico de madera muy tenue
        osc2.type = "triangle";
        osc2.frequency.setValueAtTime(n.freq * 2, noteTime);

        gain.gain.setValueAtTime(0.0001, noteTime);
        gain.gain.linearRampToValueAtTime(n.gain, noteTime + 0.025);
        // Decaimiento sedoso que se queda vibrando en el aire
        gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + n.dur);

        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(noteTime);
        osc2.start(noteTime);
        osc.stop(noteTime + n.dur + 0.05);
        osc2.stop(noteTime + n.dur + 0.05);
      });
    }

    // Programar toda la partitura del ciclo
    function scheduleAudioTrack() {
      if (!isAudioActive || !audioCtx) return;

      const now = audioCtx.currentTime;

      // Cronograma sincronizado con el CSS:
      playCuriosityTone(now + 0.85); // 0.85s: Momento Ajá
      playWoodHop(now + 1.20);       // 1.20s: Saltito en el suelo
      playAirWhoosh(now + 2.05);     // 2.05s: Despegue del gran salto
      playPreContact(now + 2.50);    // 2.50s: Fase 1 - Contacto previo guía (ti-)
      playSnapImpact(now + 2.65);    // 2.65s: Fase 2 - ¡CLACK! Bloqueo mecánico en la C
      playSpanishGuitarArpeggio(now + 2.76); // 2.76s: Arpegio de guitarra española serena y armoniosa // 2.75s: Frase ascendente luminosa (Sol -> Do -> Mi) que invita a entrar

      // Programar siguiente ciclo exacto
      clearTimeout(cycleTimer);
      cycleTimer = setTimeout(scheduleAudioTrack, CYCLE_DURATION * 1000);
    }

    // Reiniciar animación y sincronizar sonido con el clic
    const viewport = document.getElementById("viewport");

    window.addEventListener("click", () => {
      initAudio();

      viewport.style.display = "none";
      viewport.offsetHeight; // trigger reflow
      viewport.style.display = "";

      scheduleAudioTrack();
    });
  </script>
