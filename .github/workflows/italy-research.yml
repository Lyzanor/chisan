name: Italy KM0 research export

on:
  pull_request:
    branches:
      - research/italia-km0-500-20260804
    paths:
      - .research-trigger-italy
      - scripts/research_italy_grid_runner.py
      - scripts/research_italy_geofabrik.py

permissions:
  contents: read

jobs:
  build-static-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static export dependencies
        run: python -m pip install --disable-pip-version-check requests shapely pyshp
      - name: Generate 500 candidates from the static Geofabrik extract
        run: python scripts/research_italy_geofabrik.py
      - name: Upload validated CSV
        uses: actions/upload-artifact@v4
        with:
          name: italia-km0-500-csv
          path: geofabrik-output/italia_km0_500_master.csv
          if-no-files-found: error
          retention-days: 7

  build-italy-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests shapely
      - name: Apply Shapely 2 index compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/research_italy_osm.py')
          text = path.read_text(encoding='utf-8')
          old = 'if isinstance(hit, (int,)):\n            idx = int(hit)'
          new = 'if hasattr(hit, "__index__"):\n            idx = int(hit)'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected compatibility target not found')
          PY
      - name: Generate 500 Italy KM0 candidates from live OSM
        run: python scripts/research_italy_grid_runner.py
      - name: Upload full research package
        uses: actions/upload-artifact@v4
        with:
          name: italia-km0-500
          path: research-output/
          if-no-files-found: error
          retention-days: 7
