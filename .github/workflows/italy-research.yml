name: Italy KM0 research export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-italy-research:
    if: github.head_ref == 'research/italia-km0-500-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests shapely
      - name: Generate 500 Italy KM0 candidates
        run: python scripts/research_italy_osm.py
      - name: Upload research package
        uses: actions/upload-artifact@v4
        with:
          name: italia-km0-500
          path: research-output/
          if-no-files-found: error
          retention-days: 7
