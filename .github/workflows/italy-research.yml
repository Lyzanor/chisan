name: Italy KM0 research export

on:
  pull_request:
    branches:
      - research/italia-km0-500-20260804
    paths:
      - .research-trigger-italy
      - scripts/research_italy_grid_runner.py

permissions:
  contents: read

jobs:
  fetch-existing-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch CSV from the completed Vercel research deployment
        run: |
          mkdir -p direct-output
          curl --fail-with-body --location --retry 2 --max-time 120 \
            'https://km0-git-research-italia-km0-500-20260804-lyzanors-projects.vercel.app/research/italia-500/italia_km0_500_master.csv' \
            -o direct-output/italia_km0_500_master.csv
      - name: Validate exactly 500 data rows
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('direct-output/italia_km0_500_master.csv')
          with path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.reader(handle))
          if len(rows) != 501:
              raise SystemExit(f'Expected 501 physical CSV rows including header, got {len(rows)}')
          if not rows[0] or rows[0][0] != 'numero':
              raise SystemExit('Unexpected CSV header')
          print('CSV validado: 500 registros')
          PY
      - name: Upload direct CSV
        uses: actions/upload-artifact@v4
        with:
          name: italia-km0-500-csv
          path: direct-output/italia_km0_500_master.csv
          if-no-files-found: error
          retention-days: 7

  build-italy-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests shapely
      - name: Apply Shapely 2 index compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/research_italy_osm.py')
          text = path.read_text(encoding='utf-8')
          old = 'if isinstance(hit, (int,)):\n            idx = int(hit)'
          new = 'if hasattr(hit, "__index__"):\n            idx = int(hit)'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected compatibility target not found')
          PY
      - name: Generate 500 Italy KM0 candidates
        run: python scripts/research_italy_grid_runner.py
      - name: Upload research package
        uses: actions/upload-artifact@v4
        with:
          name: italia-km0-500
          path: research-output/
          if-no-files-found: error
          retention-days: 7
