name: Italy KM0 research export

on:
  push:
    branches:
      - research/italia-km0-500-20260804
    paths:
      - scripts/research_italy_osm.py
      - .github/workflows/italy-research.yml

permissions:
  contents: write

jobs:
  build-italy-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/italia-km0-500-20260804
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests shapely
      - name: Apply Shapely 2 index compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/research_italy_osm.py')
          text = path.read_text(encoding='utf-8')
          old = 'if isinstance(hit, (int,)):\n            idx = int(hit)'
          new = 'if hasattr(hit, "__index__"):\n            idx = int(hit)'
          if old not in text:
              raise SystemExit('Expected compatibility target not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Generate 500 Italy KM0 candidates
        run: python scripts/research_italy_osm.py
      - name: Upload research package
        uses: actions/upload-artifact@v4
        with:
          name: italia-km0-500
          path: research-output/
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated research files to the isolated branch
        run: |
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research-output/
          git commit -m "research(data): generate Italy KM0 500 export"
          git push origin HEAD:research/italia-km0-500-20260804
