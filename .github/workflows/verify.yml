name: verify

# Runs the repository gate on every push to main and every pull request.
# CI always runs `verify:ai`, the superset: the data/code split in AGENTS.md
# exists to save an agent's time locally, not a runner's.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install --global pnpm@11

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Best effort: without these, the enrichment portion of test:images skips
      # itself and says so, exactly as it does on a machine without image tooling.
      - name: Install image tooling
        continue-on-error: true
        run: python -m pip install -r scripts/requirements-image-tools.txt

      - run: pnpm verify:ai
