name: verify

# Runs the repository gate on every push to main and every pull request.
# CI always runs `verify:ai`, the superset: the data/code split in AGENTS.md
# exists to save an agent's time locally, not a runner's.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: km0_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d km0_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install --global pnpm@11

      - run: pnpm install --frozen-lockfile

      - name: Apply and verify account migrations on PostgreSQL
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:assert-current
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/km0_test
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/km0_test
          KM0_ACCOUNTS_ENABLED: "true"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Best effort: without these, the enrichment portion of test:images skips
      # itself and says so, exactly as it does on a machine without image tooling.
      - name: Install image tooling
        continue-on-error: true
        run: python -m pip install -r scripts/requirements-image-tools.txt

      - run: pnpm verify:ai
